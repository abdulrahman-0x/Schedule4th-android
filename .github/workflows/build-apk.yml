name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:   # يتيح التشغيل اليدوي من تبويب Actions

permissions:
  contents: write   # مطلوب لإنشاء Release ورفع الـ APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # تثبيت Gradle 8.9 مباشرة، فلا حاجة لملف gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Schedule4th-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # تجهيز اسم النسخة من versionName + رقم التشغيل
      - name: Read app version
        id: ver
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -n1)
          echo "name=${VERSION_NAME:-1.0}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE:-0}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_NAME:-1.0}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # رفع الـ APK في Releases (ينشئ release جديد لكل بناء)
      # generate_release_notes: GitHub يكتب تلقائيًا «What's Changed» من الـ commits
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Schedule4th v${{ steps.ver.outputs.name }} (build ${{ github.run_number }})
          generate_release_notes: true
          body: |
            بناء تلقائي من commit `${{ github.sha }}`

            - النسخة: ${{ steps.ver.outputs.name }} (versionCode ${{ steps.ver.outputs.code }})
            - الفرع: `${{ github.ref_name }}`
            - APK: debug (غير موقّع للنشر على Google Play)
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
